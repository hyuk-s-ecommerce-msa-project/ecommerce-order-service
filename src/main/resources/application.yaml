server:
  port: 8083

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: order-service
  profiles:
    active: dev
  cloud:
    config:
      name: gameinfo,order-service
    openfeign:
      circuitbreaker:
        enabled: true
  config:
    import:
      - "optional:configserver:http://config-service:9088"
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console